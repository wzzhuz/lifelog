name: 编译 Release 包

# 与 build.yml 的分工：
#   build.yml    —— 每次 push 自动跑，产出 debug APK，用于日常开发验证
#   本文件       —— 手动触发，产出正式签名（或回退 debug 签名）的 release APK，
#                   可选自动打 tag 并创建 GitHub Release
#
# 触发方式：仓库 → Actions → 左侧选「编译 Release 包」→ 右侧 Run workflow

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本号（留空则读取 build.gradle.kts 里的 versionName）'
        required: false
        type: string
        default: ''
      create_release:
        description: '编译后自动打 tag 并创建 GitHub Release'
        required: false
        type: boolean
        default: true
      minify:
        description: '开启 R8 代码混淆与资源压缩（可能增加小组件出问题的风险）'
        required: false
        type: boolean
        default: false
      build_aab:
        description: '同时编译 AAB（上架 Google Play 用，国内一般用不到）'
        required: false
        type: boolean
        default: false
      upload_nutstore:
        description: '上传到坚果云（免费版每月 1GB 上传流量，反复调试时建议关掉）'
        required: false
        type: boolean
        default: true
      nutstore_folder:
        description: '坚果云内的目标文件夹名（只能含英文/数字，留空用 lifelog-releases）'
        required: false
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: 编译 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 8.13（带依赖缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # ---------------------------------------------------------------
      # 签名处理
      #
      # 推荐：把正式密钥转成 base64 存进 Secrets（RELEASE_KEYSTORE_BASE64），
      #       再配 KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 三项。
      #       这样密钥不进仓库，且各版本签名一致，能覆盖升级。
      #
      # 未配置时：自动回退用仓库里的 debug.keystore。
      #           能用，但任何拿到你仓库的人都能签出「同名同签名」的包，
      #           所以仅供自用测试，不建议对外分发。
      # ---------------------------------------------------------------
      - name: 准备签名密钥
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lifelog-release.keystore"
            echo "LIFELOG_KEYSTORE_FILE=$RUNNER_TEMP/lifelog-release.keystore" >> $GITHUB_ENV
            echo "LIFELOG_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "LIFELOG_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"             >> $GITHUB_ENV
            echo "LIFELOG_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"       >> $GITHUB_ENV
            echo "✅ 使用 Secrets 中的正式签名密钥"
          else
            echo "⚠️  未配置 RELEASE_KEYSTORE_BASE64，将回退使用仓库内的 debug.keystore"
            echo "   签名可用但非专用密钥，仅供自用测试，不建议对外分发"
          fi
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: 确定版本号
        id: ver
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            V="${{ inputs.version_name }}"
          else
            V=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          fi
          V="${V#v}"
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "版本号: $V"

      # 注意：release 构建会跑 lintVital，fatal 级 Lint 错误会中断构建。
      # debug 构建不跑这个检查，所以本地和 CI 的 debug 都发现不了。
      - name: 编译 Release APK
        run: |
          if [ "${{ inputs.minify }}" = "true" ]; then
            gradle assembleRelease -PminifyRelease=true --stacktrace --no-daemon
          else
            gradle assembleRelease --stacktrace --no-daemon
          fi

      - name: 编译 AAB
        if: inputs.build_aab
        run: gradle bundleRelease --stacktrace --no-daemon

      - name: 重命名产物
        id: rename
        run: |
          cd app/build/outputs/apk/release
          # 中文前缀必须单独成行，不能和下面的表达式写进同一个字符串。
          # 因为 GitHub 在解析 workflow 时会做一次全局的表达式插值替换，
          # 中文与表达式同行会被替换过程破坏（v1.0.0 曾产出 "-v1.0.0.apk"）。
          # 拆成两段拼接即可保留中文。
          NAME_PREFIX="生活手记"
          APK="${NAME_PREFIX}-v${{ steps.ver.outputs.version }}.apk"
          mv app-release.apk "$APK"
          ls -lh
          echo "apk_name=$APK" >> $GITHUB_OUTPUT
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "size=$(du -h "$APK" | cut -f1)" >> $GITHUB_OUTPUT

      - name: 校验签名信息
        run: |
          keytool -printcert -jarfile "app/build/outputs/apk/release/${{ steps.rename.outputs.apk_name }}" 2>/dev/null \
            || jarsigner -verify -verbose -certs "app/build/outputs/apk/release/${{ steps.rename.outputs.apk_name }}" | head -20

      # 注意：artifact 名里的中文不能直接和表达式写在同一行，否则会被表达式
      # 替换过程破坏。这里统一改用上一步输出的 apk_name（中文来自运行时变量值，
      # 不参与 YAML 层的插值），顺带保证 artifact 名与文件名一致。
      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.apk_name }}
          path: app/build/outputs/apk/release/${{ steps.rename.outputs.apk_name }}
          retention-days: 365
          if-no-files-found: error

      - name: 上传 AAB
        if: inputs.build_aab
        uses: actions/upload-artifact@v4
        with:
          name: lifelog-aab-${{ steps.ver.outputs.version }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 365
          if-no-files-found: error

      # ---------------------------------------------------------------
      # 可选：自动打 tag 并发布 Release
      # ---------------------------------------------------------------
      - name: 创建 tag 并发布 Release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          APK="app/build/outputs/apk/release/${{ steps.rename.outputs.apk_name }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # tag 已存在则先删除，保证重复发布同一版本时能被覆盖
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git push origin --delete "$TAG" || true
          fi
          git tag -f "$TAG"
          git push origin "$TAG"

          {
            echo "生活手记 $TAG"
            echo ""
            echo "自动编译的 Release 版本。"
            echo ""
            echo "**安装提示**"
            echo "- 下载下方 APK 传到手机，允许「未知来源应用」后安装"
            echo ""
            echo "**安全提示**"
            if [ -n "$RELEASE_KEYSTORE_B64" ]; then
              echo "- 使用专用 release 密钥签名，与旧版本签名一致可直接覆盖升级"
            else
              echo "- ⚠️ 本包使用仓库内的 debug 密钥签名（未配置 RELEASE_KEYSTORE_BASE64）"
              echo "- 该密钥是公开的，任何人都能签出同名同签名的包，请勿对外分发"
            fi
            echo ""
            echo "**校验信息**"
            echo "- 文件大小：${{ steps.rename.outputs.size }}"
            echo "- SHA256：\`${{ steps.rename.outputs.sha256 }}\`"
          } > /tmp/notes.md

          gh release create "$TAG" "$APK" \
            --title "生活手记 $TAG" \
            --notes-file /tmp/notes.md \
            || gh release edit "$TAG" --notes-file /tmp/notes.md \
               && gh release upload "$TAG" "$APK" --clobber

      # ---------------------------------------------------------------
      # 上传到坚果云（WebDAV）
      #
      # 前置配置：
      #   1. 坚果云网页端 → 账户信息 → 安全选项 → 第三方应用管理
      #      → 添加应用密码（注意是「应用密码」，不是登录密码）
      #   2. 本仓库 Settings → Secrets and variables → Actions 添加：
      #      JGY_USER          —— 坚果云账号（一般是注册邮箱）
      #      JGY_APP_PASSWORD  —— 上一步生成的应用密码
      #
      # 免费版配额：每月上传 1GB / 下载 3GB，单文件上限 500MB。
      # 本项目 APK 约 20MB，每月可上传约 50 次，自用完全够。
      # 注意：流量清零按账号注册时间滚动，不是每月 1 号。
      # ---------------------------------------------------------------
      - name: 上传到坚果云
        id: nutstore
        if: inputs.create_release && inputs.upload_nutstore
        env:
          JGY_USER: ${{ secrets.JGY_USER }}
          JGY_APP_PASSWORD: ${{ secrets.JGY_APP_PASSWORD }}
          APK_NAME: ${{ steps.rename.outputs.apk_name }}
          FOLDER: ${{ inputs.nutstore_folder }}
        run: |
          # 注意：这里刻意不用 set -e。之前 set -e 会让 curl 一旦返回非 0
          # 就立刻终止脚本，真实的 HTTP 状态码根本没机会打印出来。
          APK_PATH="app/build/outputs/apk/release/$APK_NAME"

          # 未配置 Secrets 时跳过，而不是让整个 workflow 失败
          if [ -z "$JGY_USER" ] || [ -z "$JGY_APP_PASSWORD" ]; then
            echo "⚠️  未配置 JGY_USER / JGY_APP_PASSWORD，跳过坚果云上传"
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          DIR="${FOLDER:-lifelog-releases}"
          APK_ENC=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["APK_NAME"]))')
          DIR_ENC=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["DIR"]))')

          ROOT="https://dav.jianguoyun.com/dav"
          BASE="$ROOT/$DIR_ENC"
          AUTH="$JGY_USER:$JGY_APP_PASSWORD"

          echo "目标：坚果云 /$DIR/$APK_NAME"
          echo "本地： $APK_PATH"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ 本地找不到 APK，终止上传"; exit 1
          fi
          echo "大小： $(du -h "$APK_PATH" | cut -f1)"
          echo ""

          # ---- 第 1 步：认证连通性测试（只读，不消耗流量）----
          echo "【1/3】测试账号认证（PROPFIND /dav/）"
          C1=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
                 -u "$AUTH" -X PROPFIND -H "Depth: 0" "$ROOT/")
          echo "      → HTTP $C1"
          if [ "$C1" = "401" ] || [ "$C1" = "403" ]; then
            echo "❌ 认证失败。请确认 JGY_APP_PASSWORD 填的是『应用密码』（安全选项→第三方应用管理里生成的那串），"
            echo "   不是坚果云登录密码——自 2023 年起登录密码已被 WebDAV 拒绝。"
            exit 1
          elif [ "$C1" = "000" ]; then
            echo "❌ 连不上坚果云（网络层失败）。可能是跨境链路超时或 runner 出口被拦，稍后重试。"
            exit 1
          fi

          # ---- 第 2 步：确保目录存在 ----
          echo "【2/3】确保目录 /$DIR 存在"
          C2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
                 -u "$AUTH" -X MKCOL "$BASE")
          echo "      → HTTP $C2（201=新建  405=已存在  409=父目录异常）"
          if [ "$C2" != "201" ] && [ "$C2" != "405" ]; then
            echo "❌ 目录创建失败（HTTP $C2）。可先在坚果云网页端手动建一个名为 $DIR 的文件夹再重试。"
            exit 1
          fi

          # ---- 第 3 步：上传 APK ----
          echo "【3/3】上传 APK（跨境传输，可能需要几分钟）"
          OUT=$(curl -s -w '\n__CODE__%{http_code}' \
                  --retry 2 --retry-delay 15 --retry-connrefused --max-time 900 \
                  -u "$AUTH" -T "$APK_PATH" "$BASE/$APK_ENC" 2>&1)
          CODE=$(printf '%s' "$OUT" | sed -n 's/.*__CODE__//p' | tail -1)
          BODY=$(printf '%s' "$OUT" | sed 's/__CODE__.*//')
          echo "      → HTTP $CODE"
          [ -n "$BODY" ] && echo "      响应体：$BODY"

          if [ "$CODE" != "201" ] && [ "$CODE" != "204" ]; then
            echo "❌ 上传失败（HTTP $CODE）。对照："
            echo "   401/403 认证或权限被拒；404/409 父目录不存在；"
            echo "   507 空间不足；000 网络中断/超时（curl 报错见上方响应体）"
            exit 1
          fi

          # ---- 校验：确认文件真的落盘 ----
          CHECK=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
                    -u "$AUTH" -I "$BASE/$APK_ENC")
          echo "校验 HEAD → HTTP $CHECK"

          echo "✅ 已上传 → 坚果云 /$DIR/$APK_NAME"
          echo "skipped=false" >> $GITHUB_OUTPUT
          echo "path=/$DIR/$APK_NAME" >> $GITHUB_OUTPUT

      - name: 输出摘要
        run: |
          echo "### Release 编译完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 版本：v${{ steps.ver.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- 大小：${{ steps.rename.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "- SHA256：\`${{ steps.rename.outputs.sha256 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 混淆：${{ inputs.minify }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.create_release }}" = "true" ]; then
            echo "已发布到 [Releases](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
          else
            echo "未勾选发布，产物在下方 **Artifacts** 区域下载。" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          case "${{ steps.nutstore.outputs.skipped }}" in
            true)  echo "☁️ 坚果云：已跳过（未配置 JGY_USER / JGY_APP_PASSWORD）" >> $GITHUB_STEP_SUMMARY ;;
            false) echo "☁️ 坚果云：已上传至 \`${{ steps.nutstore.outputs.path }}\`" >> $GITHUB_STEP_SUMMARY ;;
            *)     echo "☁️ 坚果云：未上传（未勾选或本次未发布）" >> $GITHUB_STEP_SUMMARY ;;
          esac
