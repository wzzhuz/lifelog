name: 编译 Release 包

# 与 build.yml 的分工：
#   build.yml    —— 每次 push 自动跑，产出 debug APK，用于日常开发验证
#   本文件       —— 手动触发，产出正式签名（或回退 debug 签名）的 release APK，
#                   可选自动打 tag 并创建 GitHub Release
#
# 触发方式：仓库 → Actions → 左侧选「编译 Release 包」→ 右侧 Run workflow

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本号（留空则读取 build.gradle.kts 里的 versionName）'
        required: false
        type: string
        default: ''
      create_release:
        description: '编译后自动打 tag 并创建 GitHub Release'
        required: false
        type: boolean
        default: true
      minify:
        description: '开启 R8 代码混淆与资源压缩（可能增加小组件出问题的风险）'
        required: false
        type: boolean
        default: true
      build_aab:
        description: '同时编译 AAB（上架 Google Play 用，国内一般用不到）'
        required: false
        type: boolean
        default: false
      upload_nutstore:
        description: '上传到坚果云（免费版每月 1GB 上传流量，反复调试时建议关掉）'
        required: false
        type: boolean
        default: true
      nutstore_folder:
        description: '坚果云内的目标文件夹名（只能含英文/数字，留空用 lifelog-releases）'
        required: false
        type: string
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write      # 清理旧 Release 包需要

jobs:
  release:
    name: 编译 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 8.13（带依赖缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # ---------------------------------------------------------------
      # 签名处理
      #
      # 推荐：把正式密钥转成 base64 存进 Secrets（RELEASE_KEYSTORE_BASE64），
      #       再配 KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 三项。
      #       这样密钥不进仓库，且各版本签名一致，能覆盖升级。
      #
      # 未配置时：自动回退用仓库里的 debug.keystore。
      #           能用，但任何拿到你仓库的人都能签出「同名同签名」的包，
      #           所以仅供自用测试，不建议对外分发。
      # ---------------------------------------------------------------
      # 四项全部取到才启用正式签名。
      # 关键：Secret 缺失时 ${{ secrets.X }} 会展开成空串，直接 echo 进 GITHUB_ENV
      # 写进去的仍是空值 —— Gradle 侧 isNotBlank() 判假，release 静默回退 debug 签名，
      # 而这里却照样打印「✅ 使用正式密钥」。必须逐个校验通过后再写入 $GITHUB_ENV。
      - name: 准备签名密钥
        run: |
          MISSING=""
          [ -n "$RELEASE_KEYSTORE_B64" ] || MISSING="$MISSING RELEASE_KEYSTORE_BASE64"
          [ -n "$STORE_PW" ]             || MISSING="$MISSING KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS_V" ]          || MISSING="$MISSING KEY_ALIAS"
          [ -n "$KEY_PW" ]               || MISSING="$MISSING KEY_PASSWORD"

          if [ -n "$MISSING" ]; then
            echo "⚠️  缺少 Secret:$MISSING"
            echo "   → 将回退使用仓库内的 debug.keystore（仅供自用测试，不建议对外分发）"
            echo "   补齐路径：Settings → Secrets and variables → Actions → Repository secrets"
          else
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lifelog-release.keystore"
            echo "LIFELOG_KEYSTORE_FILE=$RUNNER_TEMP/lifelog-release.keystore" >> $GITHUB_ENV
            echo "LIFELOG_STORE_PASSWORD=$STORE_PW"  >> $GITHUB_ENV
            echo "LIFELOG_KEY_ALIAS=$KEY_ALIAS_V"    >> $GITHUB_ENV
            # PKCS12 下私钥即用 storepass 加密，keyPassword 必须与 storePassword 一致
            echo "LIFELOG_KEY_PASSWORD=$KEY_PW"      >> $GITHUB_ENV
            echo "✅ 使用 Secrets 中的正式签名密钥"
          fi
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PW:             ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_V:          ${{ secrets.KEY_ALIAS }}
          KEY_PW:               ${{ secrets.KEY_PASSWORD }}

      - name: 确定版本号
        id: ver
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            V="${{ inputs.version_name }}"
          else
            V=$(grep -m1 -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          fi
          V="${V#v}"
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "版本号: $V"

      # 注意：release 构建会跑 lintVital，fatal 级 Lint 错误会中断构建。
      # debug 构建不跑这个检查，所以本地和 CI 的 debug 都发现不了。
      - name: 编译 Release APK
        run: |
          if [ "${{ inputs.minify }}" = "true" ]; then
            gradle assembleRelease -PminifyRelease=true --stacktrace --no-daemon
          else
            gradle assembleRelease --stacktrace --no-daemon
          fi

      - name: 编译 AAB
        if: inputs.build_aab
        run: gradle bundleRelease --stacktrace --no-daemon

      - name: 重命名产物
        id: rename
        run: |
          cd app/build/outputs/apk/release
          # 文件名必须用纯 ASCII。原因（已实测验证）：
          # GitHub Releases 的资产上传接口不支持非 ASCII 资产名，上传时会静默
          # 丢弃中文。实测用 API 上传「生活手记-v9.9.9.apk」，接口返回的资产名
          # 是「-v9.9.9.apk」，中文被直接删掉，且不报错。
          # 而 Actions 的 artifact 名支持 Unicode，所以同样的名字在 Actions 里
          # 显示正常、到 Release 页就“缺字”——两者不一致的根因就在这里。
          # 中文标题保留在 Release 标题和说明里（那些是普通文本，不受影响）。
          APK="lifelog-v${{ steps.ver.outputs.version }}.apk"
          mv app-release.apk "$APK"
          ls -lh
          echo "apk_name=$APK" >> $GITHUB_OUTPUT
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "size=$(du -h "$APK" | cut -f1)" >> $GITHUB_OUTPUT

      # 不能只信日志里的「✅ 使用正式密钥」：那是准备步骤自己打印的，Secret 配漏时
      # 同样会打印。真正的判定看 APK 里证书的 Owner —— debug.keystore 是 CN=LifeLog Debug，
      # 命中即中断，避免把 debug 签名的包当成正式包发出去。
      - name: 校验签名信息
        run: |
          APK="app/build/outputs/apk/release/${{ steps.rename.outputs.apk_name }}"
          keytool -printcert -jarfile "$APK" | tee /tmp/cert.txt
          if grep -q "LifeLog Debug" /tmp/cert.txt; then
            echo "❌ 本包仍是 debug 签名（CN=LifeLog Debug），正式密钥未生效"
            echo "   请检查 4 个 Secret 是否齐全、KEY_PASSWORD 是否与 KEYSTORE_PASSWORD 一致"
            exit 1
          fi
          echo "✅ 已使用正式密钥签名"

      # artifact 名与文件名保持一致，都用 ASCII，避免 Release 页与 Actions 页
      # 显示不一致（详见「重命名产物」步骤的说明）。
      # 上传失败不中断：后面还有「创建 Release 附件」和「上传坚果云」两条
      # 交付路径，都不占 Actions 制品配额。配额打满时，APK 仍能从这两处取到。
      - name: 上传 Release APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename.outputs.apk_name }}
          path: app/build/outputs/apk/release/${{ steps.rename.outputs.apk_name }}
          retention-days: 90
          if-no-files-found: error

      # 只留最近 5 个历史版本：回溯够用，又不至于把 500MB 共享配额吃光。
      # 每个 APK 约 3~15MB，5 个封顶约 75MB。
      - name: 只保留最近 5 个 Release APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/cleanup-artifacts.sh \
            --pattern 'lifelog-v*' --keep 5

      - name: 上传 AAB
        if: inputs.build_aab
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lifelog-aab-${{ steps.ver.outputs.version }}
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
          if-no-files-found: error

      # ---------------------------------------------------------------
      # 可选：自动打 tag 并发布 Release
      # ---------------------------------------------------------------
      - name: 创建 tag 并发布 Release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 不声明的话本步骤读不到该变量，Release 说明会恒定打印「使用 debug 密钥」，
          # 与实际签名无关，不能作为判定依据。
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          APK="app/build/outputs/apk/release/${{ steps.rename.outputs.apk_name }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # tag 已存在则先删除，保证重复发布同一版本时能被覆盖
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git push origin --delete "$TAG" || true
          fi
          git tag -f "$TAG"
          git push origin "$TAG"

          {
            echo "生活手记 $TAG"
            echo ""
            echo "自动编译的 Release 版本。"
            echo ""
            echo "**安装提示**"
            echo "- 下载下方 APK 传到手机，允许「未知来源应用」后安装"
            echo ""
            echo "**安全提示**"
            if [ -n "$RELEASE_KEYSTORE_B64" ]; then
              echo "- 使用专用 release 密钥签名，与旧版本签名一致可直接覆盖升级"
            else
              echo "- ⚠️ 本包使用仓库内的 debug 密钥签名（未配置 RELEASE_KEYSTORE_BASE64）"
              echo "- 该密钥是公开的，任何人都能签出同名同签名的包，请勿对外分发"
            fi
            echo ""
            echo "**校验信息**"
            echo "- 文件大小：${{ steps.rename.outputs.size }}"
            echo "- SHA256：\`${{ steps.rename.outputs.sha256 }}\`"
          } > /tmp/notes.md

          gh release create "$TAG" "$APK" \
            --title "生活手记 $TAG" \
            --notes-file /tmp/notes.md \
            || gh release edit "$TAG" --notes-file /tmp/notes.md \
               && gh release upload "$TAG" "$APK" --clobber

      # ---------------------------------------------------------------
      # 上传到坚果云（WebDAV）
      #
      # 前置配置：
      #   1. 坚果云网页端 → 账户信息 → 安全选项 → 第三方应用管理
      #      → 添加应用密码（注意是「应用密码」，不是登录密码）
      #   2. 本仓库 Settings → Secrets and variables → Actions 添加：
      #      JGY_USER          —— 坚果云账号（一般是注册邮箱）
      #      JGY_APP_PASSWORD  —— 上一步生成的应用密码
      #
      # 免费版配额：每月上传 1GB / 下载 3GB，单文件上限 500MB。
      # 本项目 APK 约 20MB，每月可上传约 50 次，自用完全够。
      # 注意：流量清零按账号注册时间滚动，不是每月 1 号。
      # ---------------------------------------------------------------
      - name: 上传到坚果云
        id: nutstore
        if: inputs.create_release && inputs.upload_nutstore
        env:
          JGY_USER: ${{ secrets.JGY_USER }}
          JGY_APP_PASSWORD: ${{ secrets.JGY_APP_PASSWORD }}
          APK_NAME: ${{ steps.rename.outputs.apk_name }}
          FOLDER: ${{ inputs.nutstore_folder }}
        run: |
          # 刻意不用 set -e：curl 一旦返回非 0 就会直接终止脚本，
          # 真实的 HTTP 状态码根本没机会打印出来。
          # 全程日志同时写进 Job Summary，运行页直接就能看，不用翻日志。
          LOG=/tmp/nutstore.log
          : > "$LOG"
          log()  { echo "$*" | tee -a "$LOG"; }
          # 用 DUMPED 去重 + EXIT trap：无论脚本从哪里退出（包括 python3
          # 之类的子进程崩掉），诊断日志都会被写进 Job Summary，
          # 不会出现「失败了但 summary 一片空白」的情况。
          DUMPED=0
          dump() {
            [ "$DUMPED" = "1" ] && return 0
            DUMPED=1
            { echo "### 坚果云上传诊断"; echo '```'; cat "$LOG"; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          }
          trap dump EXIT
          fail() { log "❌ $*"; exit 1; }

          APK_PATH="app/build/outputs/apk/release/$APK_NAME"

          # 未配置 Secrets 时跳过，而不是让整个 workflow 失败
          if [ -z "$JGY_USER" ] || [ -z "$JGY_APP_PASSWORD" ]; then
            log "跳过坚果云上传：未配置 JGY_USER / JGY_APP_PASSWORD"
            log "（Settings → Secrets and variables → Actions → Repository secrets）"
            dump
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          DIR="${FOLDER:-lifelog-releases}"
          # 用命令行参数传值，不要读 os.environ：DIR 是普通 shell 变量（未 export），
          # 子进程 python3 看不到，会抛 KeyError: 'DIR'。
          urlenc() { python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$1"; }
          APK_ENC=$(urlenc "$APK_NAME")
          DIR_ENC=$(urlenc "$DIR")

          ROOT="https://dav.jianguoyun.com/dav"
          BASE="$ROOT/$DIR_ENC"
          AUTH="$JGY_USER:$JGY_APP_PASSWORD"

          log "目标路径：坚果云 /$DIR/$APK_NAME"
          log "本地文件：$APK_PATH"
          [ -f "$APK_PATH" ] || fail "本地找不到 APK，无法上传"
          log "文件大小：$(du -h "$APK_PATH" | cut -f1)"
          log "账号：$JGY_USER"
          log ""

          # ---- 第 1 步：认证连通性（只读，不消耗流量）----
          log "【1/3】认证测试  PROPFIND $ROOT/"
          R1=$(curl -s -w '\n__C__%{http_code}|__E__%{errormsg}' --max-time 60 \
                 -u "$AUTH" -X PROPFIND -H "Depth: 0" "$ROOT/" 2>&1)
          C1=$(printf '%s' "$R1" | sed -n 's/.*__C__//p' | cut -d'|' -f1)
          E1=$(printf '%s' "$R1" | sed -n 's/.*__E__//p')
          log "  状态码：$C1"
          [ -n "$E1" ] && [ "$E1" != "" ] && log "  curl 信息：$E1"
          case "$C1" in
            207|200|201) log "  认证通过" ;;
            401|403) fail "认证被拒（HTTP $C1）。JGY_APP_PASSWORD 必须填『应用密码』，即坚果云网页端 账户信息 → 安全选项 → 第三方应用管理 生成的那串，不是登录密码。自 2023 年起坚果云已拒绝用登录密码直连 WebDAV。" ;;
            000) fail "连不上坚果云（HTTP 000 = 网络层失败）。curl 信息：$E1 —— GitHub runner 在美国，跨境链路抖动或被中途拦截时容易复现，换个时间重跑即可。" ;;
            *) fail "认证测试返回异常状态码 HTTP $C1" ;;
          esac
          log ""

          # ---- 第 2 步：确保目录存在 ----
          log "【2/3】建目录  MKCOL /$DIR"
          R2=$(curl -s -w '\n__C__%{http_code}|__E__%{errormsg}' --max-time 60 \
                 -u "$AUTH" -X MKCOL "$BASE" 2>&1)
          C2=$(printf '%s' "$R2" | sed -n 's/.*__C__//p' | cut -d'|' -f1)
          E2=$(printf '%s' "$R2" | sed -n 's/.*__E__//p')
          log "  状态码：$C2（201=新建成功  405=已存在  409=父目录不存在）"
          if [ "$C2" != "201" ] && [ "$C2" != "405" ]; then
            fail "建目录失败（HTTP $C2）。curl 信息：$E2 —— 可先在坚果云网页端手动建一个名为 $DIR 的文件夹，再重跑。"
          fi
          log ""

          # ---- 第 3 步：上传 APK ----
          log "【3/3】上传 APK（跨境传输，可能需要几分钟）"
          R3=$(curl -s -w '\n__C__%{http_code}|__E__%{errormsg}' \
                 --retry 2 --retry-delay 15 --retry-connrefused --max-time 900 \
                 -u "$AUTH" -T "$APK_PATH" "$BASE/$APK_ENC" 2>&1)
          C3=$(printf '%s' "$R3" | sed -n 's/.*__C__//p' | cut -d'|' -f1)
          E3=$(printf '%s' "$R3" | sed -n 's/.*__E__//p')
          B3=$(printf '%s' "$R3" | sed 's/__C__.*//')
          log "  状态码：$C3（201=新建  204=覆盖）"
          [ -n "$B3" ] && log "  响应体：$B3"
          [ -n "$E3" ] && log "  curl 信息：$E3"
          if [ "$C3" != "201" ] && [ "$C3" != "204" ]; then
            log "上传失败（HTTP $C3）。状态码对照：401/403 认证或权限被拒；404/409 父目录不存在；507 空间不足；000 网络中断或超时。"
            fail "APK 未上传到坚果云"
          fi
          log ""

          # ---- 校验：确认文件真的落盘 ----
          C4=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 \
                 -u "$AUTH" -I "$BASE/$APK_ENC")
          log "落盘校验 HEAD → HTTP $C4（200 = 文件确实在）"

          log "✅ 上传完成 → 坚果云 /$DIR/$APK_NAME"
          dump
          echo "skipped=false" >> $GITHUB_OUTPUT
          echo "path=/$DIR/$APK_NAME" >> $GITHUB_OUTPUT

      # 加 always()：坚果云那一步失败时，summary 仍然会生成，
      # 而诊断日志已经由该步骤自己写进 summary 了，这里只补一行状态。
      - name: 输出摘要
        if: always()
        run: |
          echo "### Release 编译完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 版本：v${{ steps.ver.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- 大小：${{ steps.rename.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "- SHA256：\`${{ steps.rename.outputs.sha256 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 混淆：${{ inputs.minify }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.create_release }}" = "true" ]; then
            echo "已发布到 [Releases](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
          else
            echo "未勾选发布，产物在下方 **Artifacts** 区域下载。" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          case "${{ steps.nutstore.outputs.skipped }}" in
            true)  echo "☁️ 坚果云：已跳过（未配置 JGY_USER / JGY_APP_PASSWORD）" >> $GITHUB_STEP_SUMMARY ;;
            false) echo "☁️ 坚果云：已上传至 \`${{ steps.nutstore.outputs.path }}\`" >> $GITHUB_STEP_SUMMARY ;;
            *)     echo "☁️ 坚果云：未上传（未勾选或本次未发布）" >> $GITHUB_STEP_SUMMARY ;;
          esac
