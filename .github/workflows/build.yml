name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:      # 允许在网页上手动点一下触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write           # 编译失败时用于回报日志（自动化诊断用）

jobs:
  build:
    name: 编译 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle（带依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 给 gradlew 加执行权限
        run: chmod +x ./gradlew

      # 关键：debug.keystore 已提交在仓库里（app/debug.keystore）。
      # 这样每次 CI 编译出的 APK 都使用同一份签名，新版本可以直接覆盖安装。
      # 如果缺失，每次全新环境会重新生成随机密钥，导致「签名不一致」装不上。
      # debug 签名密钥不含任何敏感信息，开源项目中提交它是通行做法。
      - name: 校验 debug 签名密钥存在
        run: |
          test -f app/debug.keystore && echo "✅ debug.keystore 已就绪" \
            || (echo "❌ 缺少 app/debug.keystore" && exit 1)

      # 分步执行，便于定位失败发生在配置阶段还是编译阶段
      # 注意：必须 set -o pipefail，否则「命令 | tail」的退出码永远是 tail 的 0，
      # 编译失败也会被误判为成功。
      - name: 步骤 A：Gradle 自检（验证 wrapper 与插件能否解析）
        id: step_a
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p diag
          echo "=== java ==="                       2>&1 | tee diag/a_java.log
          java -version                             2>&1 | tee -a diag/a_java.log
          echo "=== gradle 版本 ==="                 2>&1 | tee -a diag/a_java.log
          ./gradlew --version                       2>&1 | tee -a diag/a_java.log
          echo "=== 配置阶段自检（./gradlew help）==="
          ./gradlew help --stacktrace --no-daemon   2>&1 | tee diag/a_help.log
          exit $?

      - name: 步骤 B：解析依赖
        id: step_b
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:dependencies \
            --configuration debugRuntimeClasspath \
            --stacktrace --no-daemon 2>&1 | tee diag/b_deps.log
          exit $?

      - name: 步骤 C：编译 Debug APK
        id: step_c
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee diag/c_build.log
          exit $?

      # 把日志打包，失败时能下载查看
      - name: 汇总诊断信息
        if: always()
        run: |
          mkdir -p diag
          echo "step_a=${{ steps.step_a.outcome }}" > diag/result.txt
          echo "step_b=${{ steps.step_b.outcome }}" >> diag/result.txt
          echo "step_c=${{ steps.step_c.outcome }}" >> diag/result.txt
          echo "commit=${{ github.sha }}" >> diag/result.txt
          echo "runner=$(uname -a)" >> diag/result.txt
          echo "java_home=$JAVA_HOME" >> diag/result.txt

      - name: 上传诊断信息
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 诊断日志
          path: diag/
          if-no-files-found: warn

      # 把编译日志回传到仓库的 ci-diagnostics 分支。
      # 用途：CI 日志与 Artifact 下载在部分网络环境下不可达，
      # 而仓库 Contents API 始终可读，便于远程定位问题。
      # 日志不含任何密钥或个人信息。
      - name: 回传诊断日志
        if: always()
        run: |
          set +e
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-diagnostics 2>/dev/null
          mkdir -p ci-logs
          OUT="ci-logs/run-${{ github.run_number }}.txt"

          {
            echo "=== 概要 ==="
            echo "commit    : ${{ github.sha }}"
            echo "run       : ${{ github.run_number }} (#${{ github.run_id }})"
            echo "step_a    : ${{ steps.step_a.outcome }}"
            echo "step_b    : ${{ steps.step_b.outcome }}"
            echo "step_c    : ${{ steps.step_c.outcome }}"
            echo
            echo "=== A. Gradle 自检日志 ==="
            tail -n 120 diag/a_java.log 2>/dev/null
            tail -n 200 diag/a_help.log 2>/dev/null
            echo
            echo "=== C. 编译日志（末尾 400 行）==="
            tail -n 400 diag/c_build.log 2>/dev/null
          } > "$OUT"

          ls -lh "$OUT"
          git add ci-logs
          git commit -q -m "ci: run ${{ github.run_number }} 诊断日志" && \
            git push -q origin ci-diagnostics --force && echo "✅ 日志已回传" \
            || echo "⚠️ 日志回传失败"
        continue-on-error: true

      - name: 判定结果
        if: steps.step_c.outcome == 'failure'
        run: |
          echo "❌ 编译失败，详见上方 步骤 A/B/C 的输出"
          exit 1

      - name: 检查 APK 是否生成
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: 计算校验值
        id: hash
        run: |
          cd app/build/outputs/apk/debug
          echo "sha256=$(sha256sum app-debug.apk | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "size=$(du -h app-debug.apk | cut -f1)" >> $GITHUB_OUTPUT

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 生活手记-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error

      - name: 输出摘要
        run: |
          echo "### 编译完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 文件大小：${{ steps.hash.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "- SHA256：\`${{ steps.hash.outputs.sha256 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "在下面的 **Artifacts** 区域点击 \`生活手记-debug-apk\` 即可下载。" >> $GITHUB_STEP_SUMMARY

  release:
    name: 打 tag 时生成 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载刚编译好的 APK
        uses: actions/download-artifact@v4
        with:
          name: 生活手记-debug-apk
          path: ./apk

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./apk/app-debug.apk
          name: 生活手记 ${{ github.ref_name }}
          body: |
            自动编译生成的 APK，可直接安装使用。

            **安装提示**
            - 下载后传到手机，允许「未知来源应用」安装
            - 签名与之前版本一致，可直接覆盖安装，数据不会丢

            **SHA256**：见 Actions 日志
          draft: false
          prerelease: false
