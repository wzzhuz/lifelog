name: Build APK

on:
  push:
    # 用通配符覆盖全部分支，而不是逐个列前缀。
    # 此前只写了 [main, master, 'feature/**']，导致 fix/ 等非 feature
    # 前缀的分支推送后**不会触发编译**——分支存在、提交也在，
    # 但 Actions 静默不跑，很容易误以为「编译通过了」。
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:      # 允许在网页上手动点一下触发

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write      # 清理旧制品需要；不显式声明会被置为 none

jobs:
  build:
    name: 编译 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 显式指定 Gradle 版本而非依赖仓库内的 wrapper。
      # 这样 wrapper 文件损坏或缺失也不会导致构建失败。
      - name: 配置 Gradle 8.13（带依赖缓存）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 关键：debug.keystore 已提交在仓库里（app/debug.keystore）。
      # 这样每次 CI 编译出的 APK 都使用同一份签名，新版本可以直接覆盖安装。
      # 如果缺失，每次全新环境会重新生成随机密钥，导致「签名不一致」装不上。
      # debug 签名密钥不含任何敏感信息，开源项目中提交它是通行做法。
      - name: 校验 debug 签名密钥存在
        run: |
          test -f app/debug.keystore && echo "debug.keystore 已就绪" \
            || (echo "缺少 app/debug.keystore" && exit 1)

      # 关键：assembleDebug 只编译主源码，**不会碰 src/test**，
      # 所以单测里写错了也照样「编译通过」。必须单独跑一次 test，
      # 否则测试文件形同虚设（曾经就漏了这一步）。
      - name: 运行单元测试
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      # 制品上传失败不应拖垮整条流水线。
      # 配额是账号级共享且按 **GB-月累计** 计：一旦本月累计用量打满，
      # 所有仓库的上传都会被拒绝，删除制品只减慢后续增长、不退还已累计用量，
      # 要等下个计费周期重置（详见 .github/workflows/cleanup.yml 的说明）。
      # 置为 continue-on-error 后，编译/测试/签名校验等真正的质量门禁照常生效，
      # 上传失败只标注为失败步骤，不再中断后续发布动作。
      - name: 上传测试报告
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: 单元测试报告
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 30
          if-no-files-found: warn

      - name: 编译 Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: 计算校验值
        id: hash
        run: |
          cd app/build/outputs/apk/debug
          echo "sha256=$(sha256sum app-debug.apk | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "size=$(du -h app-debug.apk | cut -f1)" >> $GITHUB_OUTPUT

      # 制品配额是账号级共享的 500MB（Free 计划），debug 包约 20MB 一个，
      # 按天数保留会在高频 push 时迅速打满，之后所有上传步骤被服务端直接拒绝
      # （表现为「上传」1 秒失败，而编译步骤全部成功，错误信息不提配额）。
      # retention 设 1 天兜底，真正的控制交给后面的「只留最新 1 个」清理。
      - name: 上传 APK 产物
        id: upload_apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: 生活手记-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error

      # 原生只支持按天数保留，做不到「只留最新 N 个」。
      # debug 包每次 push 都会重建，留最新一个足够回溯，稳态占用固定在约 20MB。
      # continue-on-error 会让失败步骤显示为成功，容易漏看；
      # 这里显式告警，避免「流水线全绿但 APK 一直没上传上去」。
      - name: 制品上传失败告警
        if: steps.upload_apk.outcome == 'failure'
        run: |
          echo "### ⚠️ debug APK 未上传到 Actions 制品" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "编译与单元测试均通过，仅制品上传失败。常见原因是账号级存储配额打满" \
               "（Free 计划 500MB，所有仓库共享，还与 Packages 共用）。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "排查：Settings → Billing → 查看 Actions & Packages 存储用量；" \
               "或用「清理制品」workflow 全量清理。" >> "$GITHUB_STEP_SUMMARY"

      - name: 只保留最新 1 个 debug 包
        if: steps.upload_apk.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/cleanup-artifacts.sh \
            --pattern '生活手记-debug-apk' --keep 1

      - name: 输出摘要
        run: |
          echo "### 编译完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 文件大小：${{ steps.hash.outputs.size }}" >> $GITHUB_STEP_SUMMARY
          echo "- SHA256：\`${{ steps.hash.outputs.sha256 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "在下面的 **Artifacts** 区域点击 \`生活手记-debug-apk\` 即可下载。" >> $GITHUB_STEP_SUMMARY

  release:
    name: 打 tag 时生成 Release
    needs: build
    # 制品配额打满时 artifact 会缺失，此时下载必然失败；
    # 与其红一整个 job，不如跳过（正式包请走「编译 Release 包」，
    # 那条路径的交付不依赖 Actions 制品）。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载刚编译好的 APK
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: 生活手记-debug-apk
          path: ./apk

      - name: 创建 GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: ./apk/app-debug.apk
          name: 生活手记 ${{ github.ref_name }}
          body: |
            自动编译生成的 APK，可直接安装使用。

            **安装提示**
            - 下载后传到手机，允许「未知来源应用」安装
            - 签名与之前版本一致，可直接覆盖安装，数据不会丢

            **SHA256**：见 Actions 日志
          draft: false
          prerelease: false
